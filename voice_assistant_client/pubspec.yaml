name: voice_assistant_client
description: "Voice-Assisted Question & Answer Editor Flutter Application for Android."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  speech_to_text: ^6.6.0
  record: ^5.2.0
  audioplayers: ^5.2.1
  flutter_tts: ^3.8.3
  http: ^1.1.0
  path_provider: ^2.1.1
  sqflite: ^2.3.0
  uuid: ^4.2.1
  intl: ^0.19.0
  cupertino_icons: ^1.0.6

dependency_overrides:
  record_linux: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
